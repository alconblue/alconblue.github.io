<script type="text/javascript">
	var i=1;
	function increase()
	{
		if (i<6)
		{
		document.getElementById('body').style.background="url("+(i+1)+".jpg)";
		document.getElementById('quote').innerHTML='<img src="quote'+(i+1)+'.png" height="300" width="300">'
		i=i+1;
	}
	}
	function decrease()
	{
		if (i>1)
		{
			document.getElementById('body').style.background="url("+(i-1)+".jpg";
			document.getElementById('quote').innerHTML='<img src="quote'+(i-1)+'.png" height="300" width="300">'
			i=i-1;
		}
	}
