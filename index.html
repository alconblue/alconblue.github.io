<style>
  :root{
    --bg: #08090c;
    --panel: #101319;
    --line: rgba(255,255,255,0.09);
    --text: #e9e7e2;
    --text-dim: #b6bac0;
    --muted: #868a92;
    --accent: #ff8a4c;
    --accent-dim: rgba(255,138,76,0.16);
    --accent2: #a3b0ae;
    --accent2-dim: rgba(163,176,174,0.16);
    --serif: "Fraunces", ui-serif, Georgia, serif;
    --mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;

    /* spacing scale (4px base) */
    --sp-1: 4px;
    --sp-2: 8px;
    --sp-3: 12px;
    --sp-4: 16px;
    --sp-5: 20px;
    --sp-6: 24px;
    --sp-8: 32px;
    --sp-10: 40px;
    --sp-12: 48px;
    --sp-16: 64px;
    --sp-20: 80px;
    --sp-24: 96px;
    --sp-30: 120px;

    /* page gutter, shrinks on small screens below */
    --gutter: clamp(24px, 6vw, 64px);
  }

  *{ box-sizing: border-box; }
  html,body{ margin:0; padding:0; }

  body{
    background: var(--bg);
    color: var(--text);
    font-family: var(--mono);
    font-size: 15px;
    line-height: 1.7;
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }

  ::selection{ background: var(--accent-dim); color: var(--accent); }

  .grain{
    position: fixed; inset: 0;
    pointer-events: none;
    z-index: 5;
    opacity: 0.05;
    mix-blend-mode: overlay;
  }

  /* ---------- hero ---------- */
  .hero{
    position: relative;
    min-height: 100svh;
    display: flex;
    align-items: flex-end;
    overflow: hidden;
    border-bottom: 1px solid var(--line);
  }

  #net{
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    display:block;
  }

  .hero-fade{
    position:absolute; inset:0;
    background: linear-gradient(180deg, transparent 45%, var(--bg) 96%);
    pointer-events:none;
  }

  .hero-inner{
    position: relative;
    z-index: 2;
    width: 100%;
    max-width: 980px;
    margin: 0;
    padding: 0 var(--gutter) 9vh;
  }

  h1{
    font-family: var(--serif);
    font-weight: 500;
    font-size: clamp(38px, 7vw, 82px);
    line-height: 0.94;
    letter-spacing: -0.015em;
    margin: 0 0 var(--sp-6);
    text-wrap: balance;
    max-width: 14ch;
  }

  .role{
    font-size: 16px;
    color: #c9cdd3;
    margin: 0 0 var(--sp-6);
    min-height: 1.4em;
  }
  .role .cursor-blink{
    display:inline-block;
    width: 8px; height: 1em;
    background: var(--accent);
    margin-left: 2px;
    vertical-align: -2px;
    animation: blink 1s step-end infinite;
  }
  @keyframes blink{ 50%{ opacity: 0; } }

  .bio-term{
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 10px;
    overflow: hidden;
    margin: 0 0 var(--sp-10);
  }
  .bio-term-bar{
    display: flex;
    align-items: center;
    gap: var(--sp-2);
    padding: var(--sp-2) var(--sp-4);
    border-bottom: 1px solid var(--line);
  }
  .bio-term-dot{ width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
  .bio-term-dot.r{ background: #ff5f56; }
  .bio-term-dot.y{ background: #ffbd2e; }
  .bio-term-dot.g{ background: #27c93f; }
  .bio-term-title{ margin-left: var(--sp-2); font-size: 11px; color: var(--muted); letter-spacing: 0.03em; }
  .bio-term-actions{ margin-left: auto; display: flex; gap: var(--sp-2); }
  .bio-term-btn{
    font-family: var(--mono);
    font-size: 11px;
    background: transparent;
    color: var(--muted);
    border: 1px solid var(--line);
    padding: 3px 10px;
    border-radius: 999px;
    cursor: pointer;
  }
  .bio-term-btn:hover{ color: var(--accent); border-color: var(--accent); }

  .bio-term-output{
    padding: var(--sp-4) var(--sp-5) var(--sp-2);
    font-size: 13px;
    line-height: 1.7;
    color: var(--text-dim);
    max-height: 340px;
    overflow-y: auto;
    overflow-x: auto;
    white-space: pre;
  }
  .bio-term-hint{ color: var(--muted); }
  .bio-term-echo{ color: var(--text); }
  .bio-term-echo .p{ color: var(--accent); }
  .bio-term-err{ color: #e06a6a; }
  .bio-term-out{ color: var(--text); }

  .bio-term-inputrow{
    display: flex;
    align-items: center;
    gap: var(--sp-2);
    padding: var(--sp-2) var(--sp-5) var(--sp-4);
    font-size: 13px;
  }
  .bio-term-prompt{ color: var(--accent); flex-shrink: 0; }
  .bio-term-input{
    flex: 1;
    background: transparent;
    border: none;
    outline: none;
    color: var(--text);
    font-family: var(--mono);
    font-size: 13px;
    caret-color: var(--accent);
  }
  .bio-term-input:disabled{ opacity: 0.5; }

  .c-pp{ color: var(--muted); }
  .c-kw{ color: var(--accent2); }
  .c-id{ color: var(--accent); }
  .c-str{ color: var(--text); }
  .c-ink{ color: var(--text); font-weight: 600; }
  .c-dim{ color: var(--muted); }
  .bio-term-code{ font-size: 12px; line-height: 1.5; }

  .hero-links{
    position: absolute;
    z-index: 2;
    top: var(--sp-6);
    right: var(--gutter);
    display: flex;
    align-items: center;
    gap: var(--sp-4);
    color: var(--muted);
    opacity: 0.55;
    transition: opacity 0.2s ease;
  }
  .hero-links:hover{ opacity: 1; }
  .hero-links a{
    color: inherit;
    display: block;
    line-height: 0;
    transition: color 0.15s ease, transform 0.15s ease;
  }
  .hero-links a:hover{ color: var(--accent); transform: translateY(-1px); }
  .hero-links svg{ width: 16px; height: 16px; display: block; }

  .credit{
    position: absolute;
    z-index: 2;
    bottom: var(--sp-6);
    right: var(--gutter);
    font-size: 10px;
    letter-spacing: 0.02em;
    color: var(--muted);
    text-decoration: none;
    border-bottom: 1px solid transparent;
    opacity: 0.55;
    transition: opacity 0.2s ease, color 0.15s ease, border-color 0.15s ease;
  }
  .credit:hover{ opacity: 1; color: var(--accent); border-color: var(--accent); }
  @media (max-width: 560px){ .credit{ display: none; } }

  .journey-cta{
    margin-top: var(--sp-2);
    font-size: 13px;
    color: var(--muted);
  }
  .journey-link{
    color: var(--muted);
    text-decoration: none;
    border-bottom: 1px dashed var(--line);
    padding-bottom: 3px;
  }
  .journey-link:hover{ color: var(--accent); border-color: var(--accent); }
  .journey-link .arrow{ display: inline-block; transition: transform 0.15s ease; }
  .journey-link:hover .arrow{ transform: translateX(3px) rotate(-8deg); }

  @media (max-width: 560px){
    .hero{ align-items: flex-end; }
    h1{ font-size: clamp(30px, 11vw, 46px); }
  }

  @media (prefers-reduced-motion: reduce){
    *{ animation-duration: 0.001ms !important; transition-duration: 0.001ms !important; }
  }

  /* ---------- page transition: pivot to a star, then zoom ---------- */
  #page-root{ transform-origin: 50% 50%; }
  html.vt-animating, html.vt-animating body{ overflow: hidden; }

  #transition-star{
    position: fixed;
    top: 0; left: 0;
    width: 10px; height: 10px;
    border-radius: 50%;
    background: radial-gradient(circle, #fff 0%, var(--accent) 30%, rgba(255,138,76,0) 72%);
    transform: translate(-50%, -50%);
    opacity: 0;
    pointer-events: none;
    z-index: 50;
  }
</style>
</head>

<script>
(function(){
  const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  /* ---------- grain texture ---------- */
  (function grain(){
    const c = document.getElementById('grain');
    const size = 128;
    c.width = size; c.height = size;
    c.style.width = '100vw'; c.style.height = '100vh';
    const ctx = c.getContext('2d');
    const imgData = ctx.createImageData(size, size);
    for(let i = 0; i < imgData.data.length; i += 4){
      const v = Math.random() * 255;
      imgData.data[i] = v; imgData.data[i+1] = v; imgData.data[i+2] = v; imgData.data[i+3] = 255;
    }
    ctx.putImageData(imgData, 0, 0);
  })();

  /* ---------- cycling typewriter role text ---------- */
  (function typewriter(){
    const roles = [
      "Backend Software Engineer",
      "Systems Engineer",
      "ML Infra Engineer",
      "Applied Research Scientist"
    ];
    const el = document.getElementById('role-text');
    if(reduceMotion){ el.textContent = roles[roles.length - 1]; return; }

    const TYPE_MS = 120;
    const DELETE_MS = 65;
    const HOLD_MS = 1400;
    let roleIndex = 0;

    function typeRole(){
      const word = roles[roleIndex];
      let i = 0;
      (function typeChar(){
        el.textContent = word.slice(0, i);
        i++;
        if(i <= word.length){
          setTimeout(typeChar, TYPE_MS);
        } else {
          setTimeout(deleteRole, HOLD_MS);
        }
      })();
    }

    function deleteRole(){
      const word = roles[roleIndex];
      let i = word.length;
      (function deleteChar(){
        el.textContent = word.slice(0, i);
        i--;
        if(i >= 0){
          setTimeout(deleteChar, DELETE_MS);
        } else {
          roleIndex = (roleIndex + 1) % roles.length;
          setTimeout(typeRole, 200);
        }
      })();
    }

    typeRole();
  })();

  /* ---------- network canvas ---------- */
  (function network(){
    const canvas = document.getElementById('net');
    const hero = document.querySelector('.hero');
    const ctx = canvas.getContext('2d');
    let W, H, dpr;
    let nodes = [];
    let pulses = [];
    const NODE_COUNT = 34;
    const LINK_DIST = 170;
    const mouse = { x: -9999, y: -9999 };

    function resize(){
      dpr = Math.min(window.devicePixelRatio || 1, 2);
      W = hero.clientWidth; H = hero.clientHeight;
      canvas.width = W * dpr; canvas.height = H * dpr;
      canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }

    const PULSE_COLORS = ["255,138,76", "163,176,174"];
    let frameCount = 0;

    function initNodes(){
      nodes = [];
      for(let i = 0; i < NODE_COUNT; i++){
        nodes.push({
          x: Math.random() * W,
          y: Math.random() * H,
          vx: (Math.random() - 0.5) * 0.18,
          vy: (Math.random() - 0.5) * 0.18,
          r: 1.4 + Math.random() * 1.4,
          phase: Math.random() * Math.PI * 2,
          twinkleSpeed: 0.012 + Math.random() * 0.02
        });
      }
    }

    function spawnPulse(){
      if(nodes.length < 2) return;
      const a = nodes[Math.floor(Math.random() * nodes.length)];
      let b = a, tries = 0;
      while(b === a && tries < 10){
        const cand = nodes[Math.floor(Math.random() * nodes.length)];
        const d = Math.hypot(cand.x - a.x, cand.y - a.y);
        if(d < LINK_DIST * 1.4) b = cand;
        tries++;
      }
      if(b === a) return;
      const color = PULSE_COLORS[Math.floor(Math.random() * PULSE_COLORS.length)];
      pulses.push({ a, b, t: 0, speed: 0.006 + Math.random() * 0.006, color });
    }

    function step(){
      frameCount++;
      nodes.forEach(n => {
        n.x += n.vx; n.y += n.vy;
        if(n.x < 0 || n.x > W) n.vx *= -1;
        if(n.y < 0 || n.y > H) n.vy *= -1;

        const dx = n.x - mouse.x, dy = n.y - mouse.y;
        const d = Math.hypot(dx, dy);
        if(d < 120){
          const f = (120 - d) / 120 * 0.06;
          n.x += (dx / d) * f * 10;
          n.y += (dy / d) * f * 10;
        }
      });

      ctx.clearRect(0, 0, W, H);

      for(let i = 0; i < nodes.length; i++){
        for(let j = i + 1; j < nodes.length; j++){
          const a = nodes[i], b = nodes[j];
          const d = Math.hypot(a.x - b.x, a.y - b.y);
          if(d < LINK_DIST){
            ctx.strokeStyle = `rgba(140,165,196,${(1 - d / LINK_DIST) * 0.22})`;
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.moveTo(a.x, a.y);
            ctx.lineTo(b.x, b.y);
            ctx.stroke();
          }
        }
      }

      nodes.forEach(n => {
        const twinkle = 0.35 + 0.35 * (0.5 + 0.5 * Math.sin(frameCount * n.twinkleSpeed + n.phase));
        ctx.beginPath();
        ctx.arc(n.x, n.y, n.r, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(180,195,215,${twinkle})`;
        ctx.fill();
      });

      pulses.forEach(p => { p.t += p.speed; });
      pulses = pulses.filter(p => p.t <= 1);
      pulses.forEach(p => {
        const x = p.a.x + (p.b.x - p.a.x) * p.t;
        const y = p.a.y + (p.b.y - p.a.y) * p.t;
        const fade = Math.sin(p.t * Math.PI);
        ctx.beginPath();
        ctx.arc(x, y, 2.4, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(${p.color},${0.85 * fade})`;
        ctx.shadowColor = `rgba(${p.color},0.8)`;
        ctx.shadowBlur = 8;
        ctx.fill();
        ctx.shadowBlur = 0;
      });

      if(!reduceMotion) requestAnimationFrame(step);
    }

    resize();
    initNodes();

    window.__pickStar = function(){
      if(!nodes.length) return { x: 50, y: 50 };
      const n = nodes[Math.floor(Math.random() * nodes.length)];
      return { x: (n.x / W * 100).toFixed(1), y: (n.y / H * 100).toFixed(1) };
    };

    window.addEventListener('resize', () => { resize(); initNodes(); });
    hero.addEventListener('mousemove', e => {
      const rect = hero.getBoundingClientRect();
      mouse.x = e.clientX - rect.left;
      mouse.y = e.clientY - rect.top;
    });
    hero.addEventListener('mouseleave', () => { mouse.x = -9999; mouse.y = -9999; });

    if(reduceMotion){
      step();
    } else {
      requestAnimationFrame(step);
      setInterval(spawnPulse, 900);
    }
  })();

      0x08,0x04,0x06,0x47,0x00,0x1a,0x10,0x15,0x07,0x02,0x14,0x55,0x05,0x09,0x55,0x25,
      0x35,0x27,0x33,0x5c,0x55,0x06,0x04,0x55,0x2a,0x1f,0x07,0x00,0x11,0x1b,0x47,0x23,
      0x01,0x06,0x1e,0x19,0x02,0x09,0x5b,0x6d,0x36,0x1a,0x12,0x02,0x55,0x1e,0x15,0x14,
      0x15,0x03,0x55,0x06,0x04,0x55,0x20,0x1f,0x1a,0x00,0x1c,0x10,0x4b,0x50,0x18,0x08,
      0x06,0x1c,0x09,0x17,0x55,0x01,0x19,0x19,0x02,0x03,0x55,0x06,0x02,0x1a,0x12,0x1e,
      0x11,0x47,0x11,0x01,0x47,0x11,0x55,0x00,0x15,0x1b,0x12,0x19,0x1b,0x02,0x1c,0x0c,
      0x47,0x11,0x17,0x14,0x05,0x07,0x03,0x50,0x06,0x04,0x11,0x19,0x02,0x5e,0x7f,0x29,
      0x1f,0x02,0x47,0x04,0x1c,0x09,0x1b,0x10,0x15,0x19,0x1b,0x00,0x50,0x14,0x13,0x50,
      0x34,0x0a,0x12,0x1c,0x02,0x1e,0x01,0x49,0x11,0x1c,0x5d,0x50,0x03,0x0e,0x14,0x10,
      0x08,0x5c,0x55,0x14,0x04,0x07,0x02,0x11,0x18,0x0e,0x1e,0x12,0x4b,0x50,0x32,0x37,
      0x25,0x06,0x4b,0x50,0x1c,0x09,0x16,0x07,0x06,0x5c,0x55,0x0e,0x1e,0x13,0x02,0x02,
      0x10,0x09,0x13,0x10,0x4b,0x50,0x14,0x09,0x14,0x55,0x02,0x06,0x10,0x15,0x09,0x01,
      0x0f,0x19,0x1b,0x00,0x50,0x1c,0x09,0x50,0x17,0x02,0x04,0x02,0x02,0x15,0x1b,0x49,
      0x7a
    ];

    // lay the first 138 bytes out in a 23x14 dot-matrix grid that reads "ZOEB"
    // when cat'd -- the rest continue as an ordinary dense hex dump below it.
    function buildSourceHTML(){
      const FONT = {
        Z: ['11111','00001','00010','00100','01000','10000','11111'],
        O: ['01110','10001','10001','10001','10001','10001','01110'],
        E: ['11111','10000','10000','11110','10000','10000','11111'],
        B: ['11110','10001','10001','11110','10001','10001','11110']
      };
      const WORD = ['Z','O','E','B'];
      const grid = [];
      for(let r = 0; r < 7; r++){
        let row = '';
        WORD.forEach((L, li) => { row += FONT[L][r]; if(li < WORD.length - 1) row += '0'; });
        grid.push(row);
      }

      // dense pack: every cell gets a real byte, "ink" cells just render bright
      // and everything else dim -- the ZOEB shape reads via color, not gaps.
      let idx = 0;
      const artLines = grid.map(row => {
        let line = '';
        for(const ch of row){
          const b = BYTES[idx++];
          const tok = '0x' + b.toString(16).padStart(2, '0') + ',';
          line += '<span class="' + (ch === '1' ? 'c-ink' : 'c-dim') + '">' + tok + '</span>';
        }
        return line;
      });

      const rest = BYTES.slice(idx);
      const restLines = [];
      for(let i = 0; i < rest.length; i += 16){
        restLines.push('<span class="c-dim">' + rest.slice(i, i + 16).map(b => '0x' + b.toString(16).padStart(2, '0')).join(',') + ',</span>');
      }

      return '<span class="c-pp">#include &lt;stdio.h&gt;</span>\n'
        + '<span class="c-pp">#define R putchar</span>\n'
        + '<span class="c-kw">static</span> <span class="c-kw">char</span> *<span class="c-id">K</span>=<span class="c-str">"gpu"</span>;\n'
        + '<span class="c-kw">static</span> <span class="c-kw">unsigned</span> <span class="c-kw">char</span> <span class="c-id">M</span>[]={\n'
        + artLines.join('\n') + '\n'
        + restLines.join('\n') + '};\n'
        + '<span class="c-kw">int</span> <span class="c-id">main</span>(<span class="c-kw">int</span> c,<span class="c-kw">char</span>**v){<span class="c-kw">int</span> i;<span class="c-kw">for</span>(i=0;i&lt;<span class="c-kw">sizeof</span> <span class="c-id">M</span>;i++)<span class="c-id">R</span>(<span class="c-id">M</span>[i]^<span class="c-id">K</span>[i%3]);<span class="c-kw">return</span>!c;}';
    }

    const SOURCE_HTML = '<code class="bio-term-code">' + buildSourceHTML() + '</code>';

    function decodeBio(){
      let out = '';
      for(let i = 0; i < BYTES.length; i++){
        out += String.fromCharCode(BYTES[i] ^ KEY.charCodeAt(i % KEY.length));
      }
      return out;
    }

    const term = document.getElementById('bio-term');
    const output = document.getElementById('bio-output');
    const input = document.getElementById('bio-input');
    const playBtn = document.getElementById('bio-play');
    const resetBtn = document.getElementById('bio-reset');
    if(!term) return;

    let compiled = false;
    let busy = false;

    function escapeHtml(s){
      return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }

    function printLine(html, cls){
      const div = document.createElement('div');
      if(cls) div.className = cls;
      div.innerHTML = html;
      output.appendChild(div);
      output.scrollTop = output.scrollHeight;
    }

    function resetOutput(){
      output.innerHTML = '<span class="bio-term-hint">try: ls, gcc, cat, ./bio, clear — or hit play</span>';
    }

    function doReset(){
      compiled = false;
      resetOutput();
    }

    function execute(raw){
      const cmd = raw.trim();
      printLine('<span class="p">zoeb@bio:~$</span> ' + escapeHtml(cmd), 'bio-term-echo');
      if(cmd === '') return;

      if(cmd === 'ls'){
        printLine(compiled ? 'bio&nbsp;&nbsp;bio.c' : 'bio.c', 'bio-term-out');
      } else if(cmd.indexOf('gcc') === 0){
        compiled = true; // real gcc is silent on success too
      } else if(cmd.indexOf('cat') === 0){
        printLine(SOURCE_HTML);
      } else if(cmd === './bio'){
        if(!compiled){
          printLine('bash: ./bio: No such file or directory', 'bio-term-err');
        } else {
          decodeBio().split('\n').filter(Boolean).forEach(l => printLine(escapeHtml(l), 'bio-term-out'));
        }
      } else if(cmd === 'clear'){
        doReset();
      } else {
        printLine('only these commands are supported: ls, gcc, cat, ./bio, clear', 'bio-term-hint');
      }
    }

    input.addEventListener('keydown', (e) => {
      if(e.key === 'Enter' && !busy){
        const val = input.value;
        input.value = '';
        execute(val);
      }
    });

    term.addEventListener('click', (e) => {
      if(e.target.tagName !== 'BUTTON') input.focus();
    });

    function wait(ms){ return new Promise(r => setTimeout(r, ms)); }

    async function typeCommand(text){
      input.value = '';
      if(reduceMotion){
        input.value = text;
      } else {
        for(let i = 0; i < text.length; i++){
          input.value += text[i];
          await wait(26);
        }
      }
      await wait(220);
      execute(text);
      input.value = '';
      await wait(reduceMotion ? 60 : 320);
    }

    playBtn.addEventListener('click', async () => {
      if(busy) return;
      busy = true;
      input.disabled = true;
      compiled = false;
      resetOutput();
      const sequence = ['ls', 'gcc -o bio bio.c', 'ls', 'cat bio.c', './bio'];
      for(const c of sequence){ await typeCommand(c); }
      input.disabled = false;
      busy = false;
      input.focus();
    });

    resetBtn.addEventListener('click', () => {
      if(busy) return;
      doReset();
      input.value = '';
      input.focus();
    });
  })();


  /* ---------- pivot, then journey into a star (one-way) ---------- */
  (function pageTransitions(){
    const root = document.getElementById('page-root');
    const star = document.getElementById('transition-star');

    function pivotZoomAndNavigate(px, py, href){
      if(reduceMotion){ window.location.href = href; return; }
      const vw = window.innerWidth, vh = window.innerHeight;
      const dx = vw / 2 - px, dy = vh / 2 - py;
      const big = Math.max(vw, vh) * 2.8;
      document.documentElement.classList.add('vt-animating');

      root.animate([
        { transform: 'translate(0px,0px) scale(1)', opacity: 1, offset: 0, easing: 'cubic-bezier(0.4,0,0.2,1)' },
        { transform: `translate(${dx}px,${dy}px) scale(1)`, opacity: 1, offset: 0.4, easing: 'ease-in' },
        { transform: `translate(${dx}px,${dy}px) scale(1.05)`, opacity: 0.15, offset: 0.82 },
        { transform: `translate(${dx}px,${dy}px) scale(1.07)`, opacity: 0, offset: 1 }
      ], { duration: 2800, fill: 'forwards' });

      star.style.left = px + 'px';
      star.style.top = py + 'px';
      star.style.filter = 'brightness(1)';
      const anim = star.animate([
        // drift toward it: pan to center, barely growing yet
        { left: `${px}px`, top: `${py}px`, width: '10px', height: '10px', opacity: 0.9, filter: 'brightness(1)', offset: 0, easing: 'cubic-bezier(0.4,0,0.2,1)' },
        { left: `${vw/2}px`, top: `${vh/2}px`, width: '16px', height: '16px', opacity: 1, filter: 'brightness(1)', offset: 0.4, easing: 'cubic-bezier(0.7,0,0.84,0)' },
        // long, slow approach: still distant, growing gently
        { left: `${vw/2}px`, top: `${vh/2}px`, width: '46px', height: '46px', opacity: 1, filter: 'brightness(1)', offset: 0.72, easing: 'cubic-bezier(0.75,0,0.9,0.15)' },
        // the jump: it rushes at you
        { left: `${vw/2}px`, top: `${vh/2}px`, width: big + 'px', height: big + 'px', opacity: 1, filter: 'brightness(1.6)', offset: 1 }
      ], { duration: 2800, fill: 'forwards' });

      anim.onfinish = () => { window.location.href = href; };
    }

    const link = document.querySelector('.journey-link');
    if(link){
      link.addEventListener('click', (e) => {
        e.preventDefault();
        const href = link.getAttribute('href');
        const s = window.__pickStar ? window.__pickStar() : { x: 50, y: 50 };
        const heroRect = document.querySelector('.hero').getBoundingClientRect();
        const px = heroRect.left + (s.x / 100) * heroRect.width;
        const py = heroRect.top + (s.y / 100) * heroRect.height;
        sessionStorage.setItem('vt-dir', 'forward');
        pivotZoomAndNavigate(px, py, href);
      });
    }
  })();
})();
